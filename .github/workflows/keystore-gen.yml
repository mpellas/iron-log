# One-shot keystore generator for 90Strong Android release signing.
#
# RUN THIS WORKFLOW EXACTLY ONCE. Google App Signing uses this upload key for every
# future AAB; if you lose it you lose the ability to update the app. Save the artifact
# somewhere durable (password manager, encrypted drive) before deleting this file.
#
# How to run:
#   1. Push this file to main.
#   2. GitHub.com → Actions → "Keystore (one-shot generator)" → Run workflow.
#   3. Wait ~1 minute, open the finished run, download the "keystore-bundle" artifact.
#      The zip contains: ninetystrong-upload.jks, keystore.properties,
#      KEYSTORE_BASE64.txt (the base64 string you paste as a secret).
#   4. In the repo: Settings → Secrets and variables → Actions → New repository secret.
#      Add all four:
#        KEYSTORE_BASE64   (contents of KEYSTORE_BASE64.txt)
#        KEYSTORE_PASSWORD (from keystore.properties → storePassword)
#        KEY_ALIAS         (from keystore.properties → keyAlias)
#        KEY_PASSWORD      (from keystore.properties → keyPassword)
#   5. DELETE this workflow file from the repo (git rm .github/workflows/keystore-gen.yml
#      and push). Running it again would mint a NEW key and lock you out of updating
#      the app you already published.

name: Keystore (one-shot generator)

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK (keytool lives here)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Generate upload keystore
        run: |
          set -euo pipefail
          STORE_PASS=$(openssl rand -base64 32 | tr -d '/+=' | cut -c1-24)
          KEY_PASS=$(openssl rand -base64 32 | tr -d '/+=' | cut -c1-24)
          ALIAS=ninetystrong-upload
          mkdir -p out
          keytool -genkeypair -v \
            -keystore out/ninetystrong-upload.jks \
            -alias "$ALIAS" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$STORE_PASS" -keypass "$KEY_PASS" \
            -dname "CN=90Strong, OU=mpellas, O=90Strong, L=Coos Bay, ST=OR, C=US"
          base64 -w0 out/ninetystrong-upload.jks > out/KEYSTORE_BASE64.txt
          cat > out/keystore.properties <<EOF
          # Paste the values below into GitHub repo secrets. DO NOT COMMIT this file.
          storePassword=$STORE_PASS
          keyPassword=$KEY_PASS
          keyAlias=$ALIAS
          # storeFile is set by the build workflow at build time; nothing to paste for it.
          EOF
          cat > out/README.txt <<EOF
          90Strong upload keystore — created $(date -u +%Y-%m-%dT%H:%M:%SZ)

          FILES
            ninetystrong-upload.jks   The actual keystore. Keep this safe.
            KEYSTORE_BASE64.txt       Base64 encoding of the keystore, for GitHub secret.
            keystore.properties       Passwords + alias, for GitHub secrets.

          GITHUB SECRETS TO ADD (Settings -> Secrets and variables -> Actions):
            KEYSTORE_BASE64     = contents of KEYSTORE_BASE64.txt (one long string)
            KEYSTORE_PASSWORD   = $STORE_PASS
            KEY_PASSWORD        = $KEY_PASS
            KEY_ALIAS           = $ALIAS

          Then: delete .github/workflows/keystore-gen.yml from the repo. One-time only.
          EOF
          echo "Done."

      - name: Upload keystore bundle as artifact
        uses: actions/upload-artifact@v4
        with:
          name: keystore-bundle
          path: out/
          # Available for 7 days — download promptly, store somewhere durable.
          retention-days: 7
